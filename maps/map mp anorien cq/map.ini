Object GondorFarm
  BuildCost = 500
  ReplaceModule ModuleTag_NewMoney 
	Behavior = TerrainResourceBehavior ModuleTag_NewMoney_Override
		Radius = GONDOR_FARM_MONEY_RANGE		; How far we try to claim ground
		MaxIncome = 10	; If we were to get all we wanted, how much we would earn.  Linear slope to 0 at 0% claim
		IncomeInterval = 6000	; How often (in msec) we give that much money
	End
  End
End

