Object CloudBreakSunbeam

  ; *** ART Parameters ***
  Draw = W3DScriptedModelDraw ModuleTag_Draw
    DefaultModelConditionState
      Model               = None
      ParticleSysBone = None CloudBreakRays
    End
;    IdleAnimationState
;      EnteringStateFX = FX_CloudBreakRays
;    End 
        
    ; this is how you control birth fade
;	BirthFadeTime = 1000  ; msec
;	BirthFadeAdditive = Yes
 
  End

  ; *** AUDIO Parameters ***

  ; ***DESIGN parameters ***
  EditorSorting     = SYSTEM
  ArmorSet
    Armor = NoArmor
  End
  VisionRange = 0.0

  ; *** ENGINEERING Parameters ***
  KindOf = IMMOBILE UNATTACKABLE INERT SCARY

  Body = ActiveBody ModuleTag_01
    MaxHealth = 99999.0
  End

	; the following two modules control death fade -- uses alpha for now
	Behavior = LifetimeUpdate ModuleTag_02
		MinLifetime =  5000   ; min lifetime in msec
		MaxLifetime =  7000   ; max lifetime in msec
	End

	Behavior = FireWeaponUpdate ModuleTag_KillAllCurrentWeather ; ;
		FireWeaponNugget
			WeaponName	= WeatherKiller
			Offset = X:0 Y:0 Z:0
			FireDelay	= 0
			OneShot		= Yes
		End
	End
	
	Behavior = PassiveAreaEffectBehavior ModuleTag_MysticFountainsHealing
        EffectRadius            = 99999999 ; ;200  // please update the decal size in experience lvl INI if you change this... the value there is about 2.2x the value here        
        PingDelay                = 2000;msec
        HealPercentPerSecond    = 10%
        AllowFilter                = ANY +INFANTRY +CAVALRY -HERO -MACHINE +MONSTER -IMMOBILE +DOZER -ElvenFortressEagle
        NonStackable            = No
        HealFX                    = FX_SpellHealUnitHealBuff
    End
	
	Behavior = BannerCarrierUpdate BannerCarrierUpdateModuleTag
		IdleSpawnRate			= 2000							; spawn a new member every n seconds when idle (in miliseconds)		
		UnitSpawnFX				= FX_BannerCarrierSpawnUnit		; name of particle FX to use when the BannerCarrier spawns a new unit		

		; This well object acts like a banner carrier except it spawns unit on nearby hordes instead of itself.
		ReplenishNearbyHorde	= Yes
                ReplenishAllNearbyHordes	= Yes
		ScanHordeDistance		= 9999999
	End
	

	Behavior = AIUpdateInterface ModuleTag_03	
		AILuaEventsList				= SunbeamFunctions
	End

  Geometry = BOX
  GeometryMajorRadius = 50.0
  GeometryMinorRadius = 50.0
  GeometryHeight = 100.0
  GeometryIsSmall = No
	
End
